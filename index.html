<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイフィットログ</title>
  <!-- グラフ描画用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 0 auto; padding: 16px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; font-size: 1.2rem; color: #2c3e50; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card h2 { font-size: 1rem; margin-top: 0; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 6px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem; box-sizing: border-box; }
    input[type="number"], input[type="text"] { flex: 1; min-width: 80px; }
    button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; min-width: 60px; }
    button:hover { background: #219150; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .date-badge { text-align: center; font-weight: bold; margin-bottom: 12px; color: #7f8c8d; }
    .chart-container { position: relative; height: 220px; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>マイフィットログ</h1>
  <div class="date-badge" id="todayDate"></div>

  <!-- 折れ線グラフ -->
  <div class="card">
    <h2>📈 推移グラフ</h2>
    <div class="chart-container">
      <canvas id="fitChart"></canvas>
    </div>
  </div>

  <!-- 身体データ入力（体重・体脂肪率・カロリー） -->
  <div class="card">
    <h2>⚖️ 身体データ & 摂取カロリー</h2>
    <div class="input-row">
      <input type="number" id="weightInput" step="0.1" placeholder="体重(kg)">
      <input type="number" id="fatInput" step="0.1" placeholder="体脂肪(%)">
      <input type="number" id="calorieInput" step="10" placeholder="カロリー(kcal)">
    </div>
    <button style="width: 100%; margin-top: 4px;" onclick="saveBodyData()">保存</button>
  </div>

  <!-- 食事記録 -->
  <div class="card">
    <h2>🥗 食事メモ</h2>
    <div class="input-row">
      <input type="text" id="mealInput" placeholder="例: 胸肉、卵、さつまいも">
      <button onclick="addMeal()">追加</button>
    </div>
    <ul id="mealList"></ul>
  </div>

  <!-- 筋トレ・運動記録 -->
  <div class="card">
    <h2>🏋️ トレーニング詳細</h2>
    <div class="input-row">
      <input type="text" id="workoutNameInput" placeholder="種目名 (例: 腕立て)">
      <input type="number" id="workoutRepsInput" placeholder="レップ数/回">
      <button onclick="addWorkout()">追加</button>
    </div>
    <ul id="workoutList"></ul>
  </div>

  <script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('todayDate').innerText = `今日: ${today}`;

    let data = JSON.parse(localStorage.getItem('myFitData')) || {};
    if (!data[today]) data[today] = { weight: '', fat: '', calories: '', meals: [], workouts: [] };

    let myChart = null;

    function render() {
      const todayData = data[today];
      
      // 入力フォームの初期値
      if (todayData.weight) document.getElementById('weightInput').value = todayData.weight;
      if (todayData.fat) document.getElementById('fatInput').value = todayData.fat;
      if (todayData.calories) document.getElementById('calorieInput').value = todayData.calories;

      // 食事リスト
      const mealList = document.getElementById('mealList');
      mealList.innerHTML = todayData.meals.map(m => `<li><span>${m}</span></li>`).join('');

      // トレリスト
      const workoutList = document.getElementById('workoutList');
      workoutList.innerHTML = todayData.workouts.map(w => `<li><span><b>${w.name}</b>: ${w.reps} 回</span></li>`).join('');

      localStorage.setItem('myFitData', JSON.stringify(data));
      updateChart();
    }

    function saveBodyData() {
      data[today].weight = document.getElementById('weightInput').value;
      data[today].fat = document.getElementById('fatInput').value;
      data[today].calories = document.getElementById('calorieInput').value;
      render();
      alert('保存しました！');
    }

    function addMeal() {
      const val = document.getElementById('mealInput').value;
      if (val) { data[today].meals.push(val); render(); document.getElementById('mealInput').value = ''; }
    }

    function addWorkout() {
      const name = document.getElementById('workoutNameInput').value;
      const reps = document.getElementById('workoutRepsInput').value;
      if (name && reps) {
        data[today].workouts.push({ name: name, reps: reps });
        render();
        document.getElementById('workoutNameInput').value = '';
        document.getElementById('workoutRepsInput').value = '';
      }
    }

    function updateChart() {
      const dates = Object.keys(data).sort().slice(-7); // 直近7日分
      const weights = dates.map(d => data[d].weight || null);
      const fats = dates.map(d => data[d].fat || null);
      const calories = dates.map(d => data[d].calories || null);

      const ctx = document.getElementById('fitChart').getContext('2d');
      
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates,
          datasets: [
            { label: '体重 (kg)', data: weights, borderColor: '#27ae60', yAxisID: 'y' },
            { label: '体脂肪 (%)', data: fats, borderColor: '#e67e22', yAxisID: 'y' },
            { label: 'カロリー (kcal)', data: calories, borderColor: '#2980b9', yAxisID: 'y1' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { type: 'linear', position: 'left', title: { display: true, text: '体重/体脂肪' } },
            y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'kcal' } }
          }
        }
      });
    }

    render();
  </script>
</body>
</html>
