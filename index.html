<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイフィットログ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 0 auto; padding: 16px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; font-size: 1.2rem; color: #2c3e50; margin-bottom: 4px; }
    .date-badge { text-align: center; font-weight: bold; margin-bottom: 12px; color: #7f8c8d; font-size: 0.9rem; }
    
    /* タブ切り替えボタン */
    .tab-container { display: flex; gap: 4px; margin-bottom: 16px; background: #e0e6ed; padding: 4px; border-radius: 10px; }
    .tab-btn { flex: 1; padding: 8px 4px; border: none; background: transparent; font-weight: bold; font-size: 0.8rem; color: #555; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: white; color: #27ae60; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card h2 { font-size: 1rem; margin-top: 0; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 6px; }
    
    /* 期間切替ボタン */
    .period-container { display: flex; gap: 4px; margin-bottom: 10px; background: #f1f2f6; padding: 3px; border-radius: 6px; }
    .period-btn { flex: 1; padding: 4px; border: none; background: transparent; font-size: 0.75rem; font-weight: bold; color: #666; border-radius: 4px; cursor: pointer; }
    .period-btn.active { background: #2c3e50; color: white; }

    .input-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem; box-sizing: border-box; }
    input[type="text"], select { flex: 1; min-width: 80px; }
    button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; min-width: 60px; }
    button:hover { background: #219150; }
    .btn-edit { background: #f39c12; padding: 4px 8px; font-size: 0.75rem; margin-left: 4px; }
    .btn-delete { background: #e74c3c; padding: 4px 8px; font-size: 0.75rem; margin-left: 4px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .chart-container { position: relative; height: 190px; width: 100%; margin-top: 10px; }
    .action-btns { display: flex; gap: 4px; }
  </style>
</head>
<body>

  <h1>マイフィットログ</h1>
  <div class="date-badge" id="todayDate"></div>

  <!-- タブボタン -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="switchTab(0)">⚖️ 体重・体脂肪</button>
    <button class="tab-btn" onclick="switchTab(1)">🥗 食事・摂取</button>
    <button class="tab-btn" onclick="switchTab(2)">🏋️ 運動・消費</button>
  </div>

  <!-- 項目1: 体重・体脂肪率 -->
  <div id="tab0" class="tab-content active">
    <div class="card">
      <h2>⚖️ 体重・体脂肪率の記録</h2>
      <div class="input-row">
        <input type="text" inputmode="decimal" id="weightInput" placeholder="体重 (kg)">
        <input type="text" inputmode="decimal" id="fatInput" placeholder="体脂肪 (%)">
      </div>
      <div style="display: flex; gap: 8px;">
        <button style="flex: 1;" onclick="saveBodyData()">保存</button>
        <button style="background: #95a5a6;" onclick="clearBodyData()">リセット</button>
      </div>
    </div>
    <div class="card">
      <h2>📈 体重・体脂肪率の推移</h2>
      <div class="period-container">
        <button class="period-btn active" onclick="setPeriod('weight', 7, this)">1週間</button>
        <button class="period-btn" onclick="setPeriod('weight', 30, this)">1ヶ月</button>
        <button class="period-btn" onclick="setPeriod('weight', 365, this)">1年</button>
      </div>
      <div class="chart-container"><canvas id="chartWeight"></canvas></div>
    </div>
  </div>

  <!-- 項目2: 食事・摂取カロリー -->
  <div id="tab1" class="tab-content">
    <div class="card">
      <h2>🥗 食事メモ & 摂取カロリー</h2>
      <div class="input-row">
        <input type="text" inputmode="numeric" id="calorieInput" placeholder="総摂取カロリー (kcal)">
        <button onclick="saveCalorie()">保存</button>
      </div>
      <div class="input-row" style="margin-top: 12px;">
        <input type="text" id="mealInput" placeholder="食事メモ (例: 胸肉、さつまいも)">
        <button onclick="addMeal()">追加</button>
      </div>
      <ul id="mealList"></ul>
    </div>
    <div class="card">
      <h2>📈 摂取カロリーの推移</h2>
      <div class="period-container">
        <button class="period-btn active" onclick="setPeriod('calorie', 7, this)">1週間</button>
        <button class="period-btn" onclick="setPeriod('calorie', 30, this)">1ヶ月</button>
        <button class="period-btn" onclick="setPeriod('calorie', 365, this)">1年</button>
      </div>
      <div class="chart-container"><canvas id="chartCalorie"></canvas></div>
    </div>
  </div>

  <!-- 項目3: 運動・消費カロリー -->
  <div id="tab2" class="tab-content">
    <div class="card">
      <h2>🏋️ 運動記録 & 消費カロリー</h2>
      <div class="input-row">
        <input type="text" inputmode="numeric" id="burnCalorieInput" placeholder="総消費カロリー (kcal)">
        <button onclick="saveBurnCalorie()">保存</button>
      </div>
      <div class="input-row" style="margin-top: 12px;">
        <input type="text" id="workoutNameInput" placeholder="種目名 (例: 腕立て)">
        <input type="text" inputmode="numeric" id="workoutRepsInput" placeholder="レップ数">
        <button onclick="addWorkout()">追加</button>
      </div>
      <ul id="workoutList"></ul>
    </div>

    <!-- 消費カロリーグラフ -->
    <div class="card">
      <h2>📈 消費カロリーの推移</h2>
      <div class="period-container">
        <button class="period-btn active" onclick="setPeriod('burn', 7, this)">1週間</button>
        <button class="period-btn" onclick="setPeriod('burn', 30, this)">1ヶ月</button>
        <button class="period-btn" onclick="setPeriod('burn', 365, this)">1年</button>
      </div>
      <div class="chart-container"><canvas id="chartBurn"></canvas></div>
    </div>

    <!-- 種目別の成長（レップ数）グラフ -->
    <div class="card">
      <h2>💪 種目別トレーニングの成長グラフ</h2>
      <div class="input-row" style="margin-bottom: 10px;">
        <select id="exerciseSelect" onchange="updateWorkoutGrowthChart()"></select>
      </div>
      <div class="period-container">
        <button class="period-btn active" onclick="setPeriod('growth', 7, this)">1週間</button>
        <button class="period-btn" onclick="setPeriod('growth', 30, this)">1ヶ月</button>
        <button class="period-btn" onclick="setPeriod('growth', 365, this)">1年</button>
      </div>
      <div class="chart-container"><canvas id="chartGrowth"></canvas></div>
    </div>
  </div>

  <script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('todayDate').innerText = `今日: ${today}`;

    let data = JSON.parse(localStorage.getItem('myFitData')) || {};
    if (!data[today]) data[today] = { weight: '', fat: '', calories: '', burnCalories: '', meals: [], workouts: [] };

    // 各グラフの表示期間（デフォルト7日）
    let periods = { weight: 7, calorie: 7, burn: 7, growth: 7 };
    let chartW = null, chartC = null, chartB = null, chartG = null;

    function switchTab(index) {
      const tabs = document.querySelectorAll('.tab-content');
      const btns = document.querySelectorAll('.tab-btn');
      tabs.forEach((tab, i) => {
        tab.classList.toggle('active', i === index);
        btns[i].classList.toggle('active', i === index);
      });
      setTimeout(updateCharts, 50);
    }

    function setPeriod(type, days, btn) {
      periods[type] = days;
      // ボタンのアクティブ切り替え
      const parent = btn.parentElement;
      parent.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateCharts();
    }

    function render() {
      const todayData = data[today];
      
      document.getElementById('weightInput').value = todayData.weight || '';
      document.getElementById('fatInput').value = todayData.fat || '';
      document.getElementById('calorieInput').value = todayData.calories || '';
      document.getElementById('burnCalorieInput').value = todayData.burnCalories || '';

      const mealList = document.getElementById('mealList');
      mealList.innerHTML = (todayData.meals || []).map((m, index) => `
        <li>
          <span>${m}</span>
          <div class="action-btns">
            <button class="btn-edit" onclick="editMeal(${index})">編集</button>
            <button class="btn-delete" onclick="deleteMeal(${index})">削除</button>
          </div>
        </li>
      `).join('');

      const workoutList = document.getElementById('workoutList');
      workoutList.innerHTML = (todayData.workouts || []).map((w, index) => `
        <li>
          <span><b>${w.name}</b>: ${w.reps} 回</span>
          <div class="action-btns">
            <button class="btn-edit" onclick="editWorkout(${index})">編集</button>
            <button class="btn-delete" onclick="deleteWorkout(${index})">削除</button>
          </div>
        </li>
      `).join('');

      updateExerciseDropdown();
      localStorage.setItem('myFitData', JSON.stringify(data));
      updateCharts();
    }

    function updateExerciseDropdown() {
      const select = document.getElementById('exerciseSelect');
      const currentSelected = select.value;
      
      // 登録されているすべての種目を重複なく抽出
      const exercises = new Set();
      Object.values(data).forEach(day => {
        if (day.workouts) {
          day.workouts.forEach(w => exercises.add(w.name));
        }
      });

      select.innerHTML = '';
      if (exercises.size === 0) {
        select.innerHTML = '<option value="">種目がありません</option>';
        return;
      }

      exercises.forEach(ex => {
        const opt = document.createElement('option');
        opt.value = ex;
        opt.innerText = ex;
        select.appendChild(opt);
      });

      if (exercises.has(currentSelected)) {
        select.value = currentSelected;
      }
    }

    function saveBodyData() {
      data[today].weight = document.getElementById('weightInput').value;
      data[today].fat = document.getElementById('fatInput').value;
      render();
      alert('体重・体脂肪率を保存しました！');
    }

    function clearBodyData() {
      if (confirm('今日の体重・体脂肪率をクリアしますか？')) {
        data[today].weight = '';
        data[today].fat = '';
        render();
      }
    }

    function saveCalorie() {
      data[today].calories = document.getElementById('calorieInput').value;
      render();
      alert('摂取カロリーを保存しました！');
    }

    function addMeal() {
      const val = document.getElementById('mealInput').value;
      if (val) {
        if (!data[today].meals) data[today].meals = [];
        data[today].meals.push(val); 
        render(); 
        document.getElementById('mealInput').value = ''; 
      }
    }

    function editMeal(index) {
      const current = data[today].meals[index];
      const updated = prompt('食事メモを編集:', current);
      if (updated !== null && updated.trim() !== '') {
        data[today].meals[index] = updated.trim();
        render();
      }
    }

    function deleteMeal(index) {
      if (confirm('この食事メモを削除しますか？')) {
        data[today].meals.splice(index, 1);
        render();
      }
    }

    function saveBurnCalorie() {
      data[today].burnCalories = document.getElementById('burnCalorieInput').value;
      render();
      alert('消費カロリーを保存しました！');
    }

    function addWorkout() {
      const name = document.getElementById('workoutNameInput').value.trim();
      const reps = document.getElementById('workoutRepsInput').value.trim();
      if (name && reps) {
        if (!data[today].workouts) data[today].workouts = [];
        data[today].workouts.push({ name: name, reps: reps });
        render();
        document.getElementById('workoutNameInput').value = '';
        document.getElementById('workoutRepsInput').value = '';
      }
    }

    function editWorkout(index) {
      const current = data[today].workouts[index];
      const newName = prompt('種目名を編集:', current.name);
      if (newName === null) return;
      const newReps = prompt('レップ数を編集:', current.reps);
      if (newReps === null) return;

      if (newName.trim() !== '' && newReps.trim() !== '') {
        data[today].workouts[index] = { name: newName.trim(), reps: newReps.trim() };
        render();
      }
    }

    function deleteWorkout(index) {
      if (confirm('このトレーニング記録を削除しますか？')) {
        data[today].workouts.splice(index, 1);
        render();
      }
    }

    // 指定日数の日付配列を生成
    function getDates(days) {
      const arr = [];
      for (let i = days - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        arr.push(d.toISOString().split('T')[0]);
      }
      return arr;
    }

    function updateCharts() {
      // 1. 体重・体脂肪
      const datesW = getDates(periods.weight);
      const weights = datesW.map(d => data[d] ? data[d].weight || null : null);
      const fats = datesW.map(d => data[d] ? data[d].fat || null : null);

      if (chartW) chartW.destroy();
      chartW = new Chart(document.getElementById('chartWeight').getContext('2d'), {
        type: 'line',
        data: {
          labels: datesW.map(d => d.slice(5)), // MM-DD形式
          datasets: [
            { label: '体重 (kg)', data: weights, borderColor: '#27ae60', yAxisID: 'y' },
            { label: '体脂肪 (%)', data: fats, borderColor: '#e67e22', yAxisID: 'y1' }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            y: { type: 'linear', position: 'left', title: { display: true, text: 'kg' } },
            y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '%' } }
          }
        }
      });

      // 2. 摂取カロリー
      const datesC = getDates(periods.calorie);
      const calories = datesC.map(d => data[d] ? data[d].calories || null : null);

      if (chartC) chartC.destroy();
      chartC = new Chart(document.getElementById('chartCalorie').getContext('2d'), {
        type: 'line',
        data: {
          labels: datesC.map(d => d.slice(5)),
          datasets: [{ label: '摂取 (kcal)', data: calories, borderColor: '#2980b9', backgroundColor: 'rgba(41,128,185,0.1)', fill: true }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // 3. 消費カロリー
      const datesB = getDates(periods.burn);
      const burnCalories = datesB.map(d => data[d] ? data[d].burnCalories || null : null);

      if (chartB) chartB.destroy();
      chartB = new Chart(document.getElementById('chartBurn').getContext('2d'), {
        type: 'line',
        data: {
          labels: datesB.map(d => d.slice(5)),
          datasets: [{ label: '消費 (kcal)', data: burnCalories, borderColor: '#8e44ad', backgroundColor: 'rgba(142,68,173,0.1)', fill: true }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      updateWorkoutGrowthChart();
    }

    function updateWorkoutGrowthChart() {
      const selectedEx = document.getElementById('exerciseSelect').value;
      const datesG = getDates(periods.growth);
      
      const repsData = datesG.map(d => {
        if (!data[d] || !data[d].workouts) return null;
        // 該当する種目のレップ数を合計（またはその日の最大値など）
        const match = data[d].workouts.filter(w => w.name === selectedEx);
        if (match.length === 0) return null;
        return match.reduce((sum, w) => sum + Number(w.reps), 0);
      });

      if (chartG) chartG.destroy();
      chartG = new Chart(document.getElementById('chartGrowth').getContext('2d'), {
        type: 'line',
        data: {
          labels: datesG.map(d => d.slice(5)),
          datasets: [{ label: `${selectedEx || '種目'} (回数)`, data: repsData, borderColor: '#e74c3c', backgroundColor: 'rgba(231,76,60,0.1)', fill: true, tension: 0.1 }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    render();
  </script>
</body>
</html>
